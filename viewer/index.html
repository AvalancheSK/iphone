<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone náhľad</title>
<style>
  :root {
    --bg: #f4f4f6;
    --panel: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0a84ff;
    --ok: #30d158;
    --bad: #ff453a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --panel: #1c1c1e;
      --text: #f2f2f7;
      --muted: #a1a1a6;
      --border: #38383a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  header { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .phone {
    position: relative;
    padding: 10px;
    border-radius: 36px;
    background: #000;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
    line-height: 0;
  }
  #screen {
    display: block;
    /* výška sa zmestí aj na úzku obrazovku; šírka ide z pomeru strán obrazu */
    height: min(78vh, 900px, calc((100vw - 52px) * 19.5 / 9));
    width: auto;
    aspect-ratio: auto 9 / 19.5;
    border-radius: 28px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
    background: #000;
  }
  #placeholder {
    position: absolute;
    inset: 10px;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #a1a1a6;
    line-height: 1.5;
    background: #000;
  }
  .ripple {
    position: absolute;
    width: 36px;
    height: 36px;
    margin: -18px 0 0 -18px;
    border-radius: 50%;
    background: rgba(10, 132, 255, .45);
    pointer-events: none;
    animation: fade .5s ease-out forwards;
  }
  @keyframes fade { to { transform: scale(1.8); opacity: 0; } }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
  button, input {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input { flex: 1; min-width: 180px; }
  #msg { min-height: 1.4em; color: var(--bad); text-align: center; max-width: 520px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; max-width: 520px; }
</style>
</head>
<body>
  <header><span id="dot" class="dot"></span><span id="state">Pripájam…</span></header>

  <div class="phone" id="phone">
    <img id="screen" alt="Obrazovka iPhonu" draggable="false">
    <div id="placeholder">Čakám na obraz z iPhonu…<br>Beží <code>./scripts/start.sh</code>?</div>
  </div>

  <div class="bar">
    <button data-button="home">⌂ Domov</button>
    <button data-button="lock">Zamknúť</button>
    <button data-button="unlock">Zobudiť</button>
    <button data-button="volumeDown">Hlasitosť −</button>
    <button data-button="volumeUp">Hlasitosť +</button>
  </div>

  <form class="bar" id="typeForm">
    <input id="text" placeholder="Text na napísanie do iPhonu" autocomplete="off">
    <button type="submit">Napísať</button>
    <button type="button" id="enter">⏎ Enter</button>
  </form>

  <div id="msg"></div>
  <p class="hint">Klik = ťuknutie · podržanie = dlhé stlačenie · potiahnutie = swipe · koliesko myši = posun</p>

<script>
const screenEl = document.getElementById("screen");
const phone = document.getElementById("phone");
const placeholder = document.getElementById("placeholder");
const msg = document.getElementById("msg");
const dot = document.getElementById("dot");
const state = document.getElementById("state");
let mjpegUrl = null;
let lastConnect = 0;

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    msg.textContent = data.error || `Chyba ${res.status}`;
    throw new Error(msg.textContent);
  }
  msg.textContent = "";
  return data;
}

function connectStream() {
  if (!mjpegUrl) return;
  lastConnect = Date.now();
  screenEl.src = `${mjpegUrl}/?t=${lastConnect}`;
}
screenEl.addEventListener("load", () => { placeholder.hidden = true; });
screenEl.addEventListener("error", () => {
  placeholder.hidden = false;
  setTimeout(connectStream, 2000);
});

async function pollStatus() {
  try {
    const res = await fetch("/api/status");
    const data = await res.json();
    dot.className = "dot " + (data.ok ? "ok" : "bad");
    state.textContent = data.ok ? "iPhone pripojený" : "WebDriverAgent neodpovedá";
    if (screenEl.naturalWidth > 0) placeholder.hidden = true;
    else if (data.ok && Date.now() - lastConnect > 5000) connectStream();
  } catch {
    dot.className = "dot bad";
    state.textContent = "Server náhľadu nebeží";
  }
}

function relative(ev) {
  const r = screenEl.getBoundingClientRect();
  return {
    x: Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1),
    y: Math.min(Math.max((ev.clientY - r.top) / r.height, 0), 1),
    px: ev.clientX - r.left,
    py: ev.clientY - r.top,
  };
}

function ripple(p) {
  const el = document.createElement("div");
  el.className = "ripple";
  el.style.left = `${p.px + 10}px`;
  el.style.top = `${p.py + 10}px`;
  phone.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

let start = null;
screenEl.addEventListener("pointerdown", (ev) => {
  screenEl.setPointerCapture(ev.pointerId);
  start = { ...relative(ev), t: performance.now() };
});
screenEl.addEventListener("pointerup", (ev) => {
  if (!start) return;
  const end = relative(ev);
  const elapsed = performance.now() - start.t;
  const moved = Math.hypot(end.px - start.px, end.py - start.py);
  const from = start;
  start = null;
  if (moved < 10) {
    ripple(from);
    api(elapsed > 500 ? "/api/longpress" : "/api/tap", { x: from.x, y: from.y }).catch(() => {});
  } else {
    api("/api/swipe", {
      x1: from.x, y1: from.y, x2: end.x, y2: end.y,
      durationMs: Math.round(Math.min(Math.max(elapsed, 100), 1500)),
    }).catch(() => {});
  }
});
screenEl.addEventListener("pointercancel", () => { start = null; });

let wheelTimer = null;
let wheelDelta = 0;
screenEl.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  wheelDelta += ev.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    const dist = Math.min(Math.abs(wheelDelta) / 1000, 0.35) || 0.1;
    const dir = wheelDelta > 0 ? -1 : 1; // koliesko dole = obsah ide hore
    wheelDelta = 0;
    api("/api/swipe", { x1: 0.5, y1: 0.5, x2: 0.5, y2: 0.5 + dir * dist, durationMs: 250 }).catch(() => {});
  }, 120);
}, { passive: false });

document.querySelectorAll("[data-button]").forEach((b) => {
  b.addEventListener("click", () => api("/api/button", { name: b.dataset.button }).catch(() => {}));
});

document.getElementById("typeForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const input = document.getElementById("text");
  if (!input.value) return;
  api("/api/type", { text: input.value }).then(() => { input.value = ""; }).catch(() => {});
});
document.getElementById("enter").addEventListener("click", () => {
  api("/api/type", { text: "\n" }).catch(() => {});
});

fetch("/api/config")
  .then((r) => r.json())
  .then((cfg) => { mjpegUrl = cfg.mjpegUrl; connectStream(); });
pollStatus();
setInterval(pollStatus, 3000);
</script>
</body>
</html>
